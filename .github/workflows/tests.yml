name: tests

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

env:
  APP_KEY: zatrano-dev-key-do-not-use-prod!
  APP_ENV: testing
  APP_DEBUG: 'true'

jobs:
  linux_tests:
    runs-on: ubuntu-24.04
    name: Go ${{ matrix.go }}
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25.13']
    defaults:
      run:
        working-directory: packages
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: zatrano
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: zatrano
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d zatrano"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7.0
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - name: Checkout packages
        uses: actions/checkout@v5
        with:
          path: packages

      - name: Checkout framework
        uses: actions/checkout@v5
        with:
          repository: zatrano/framework
          ref: main
          path: framework

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: |
            packages/go.sum
            packages/**/go.sum

      - name: Download modules
        run: go mod download

      - name: Unit tests (root module + nested)
        run: bash .github/scripts/test-all.sh
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          MONGO_URI: memory

      - name: Link live SQL drivers
        run: bash .github/scripts/live-driver-link.sh

      - name: Live MySQL smoke
        run: go test ./database -run TestLiveDriverSmoke -count=1
        env:
          ZATRANO_LIVE_DB: '1'
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: zatrano
          DB_USERNAME: root
          DB_PASSWORD: ''

      - name: Live PostgreSQL smoke
        run: go test ./database -run TestLiveDriverSmoke -count=1
        env:
          ZATRANO_LIVE_DB: '1'
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: zatrano
          DB_USERNAME: postgres
          DB_PASSWORD: secret
          DB_SSLMODE: disable

  windows_tests:
    runs-on: windows-2022
    name: Go ${{ matrix.go }} - Windows
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25.13']
    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout packages
        uses: actions/checkout@v5
        with:
          path: packages

      - name: Checkout framework
        uses: actions/checkout@v5
        with:
          repository: zatrano/framework
          ref: main
          path: framework

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: packages/go.sum

      - name: Download modules
        working-directory: packages
        run: go mod download

      - name: Execute tests
        working-directory: packages
        run: go test ./...
        env:
          MONGO_URI: memory
