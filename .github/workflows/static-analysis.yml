name: static analysis

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:

permissions:
  contents: read

jobs:
  vet:
    runs-on: ubuntu-24.04
    name: go vet
    env:
      GOWORK: 'off'
    defaults:
      run:
        working-directory: packages
    steps:
      - name: Checkout packages
        uses: actions/checkout@v5
        with:
          path: packages

      - name: Checkout framework
        uses: actions/checkout@v5
        with:
          repository: zatrano/framework
          ref: main
          path: framework

      - name: Checkout canvas
        uses: actions/checkout@v5
        with:
          repository: zatrano/canvas
          ref: main
          path: canvas

      - name: Checkout rawhttp
        uses: actions/checkout@v5
        with:
          repository: zatrano/rawhttp
          ref: main
          path: rawhttp

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.13'
          cache: true
          cache-dependency-path: packages/go.sum

      - name: Download modules
        run: go mod download

      - name: Run go vet
        run: go vet ./...

  staticcheck:
    runs-on: ubuntu-24.04
    name: staticcheck
    env:
      GOWORK: 'off'
    defaults:
      run:
        working-directory: packages
    steps:
      - name: Checkout packages
        uses: actions/checkout@v5
        with:
          path: packages

      - name: Checkout framework
        uses: actions/checkout@v5
        with:
          repository: zatrano/framework
          ref: main
          path: framework

      - name: Checkout canvas
        uses: actions/checkout@v5
        with:
          repository: zatrano/canvas
          ref: main
          path: canvas

      - name: Checkout rawhttp
        uses: actions/checkout@v5
        with:
          repository: zatrano/rawhttp
          ref: main
          path: rawhttp

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.13'
          cache: true
          cache-dependency-path: packages/go.sum

      - name: Download modules
        run: go mod download

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0

      - name: Run staticcheck
        run: staticcheck ./...
